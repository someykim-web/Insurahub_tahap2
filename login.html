<!DOCTYPE html>
<html>
<head>
    <title>Login - InsuraHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>InsuraHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <section class="form-container">

        <h2>Login</h2>

        <form id="loginForm">

            <label>Email</label>
            <input type="text" id="loginEmail" placeholder="Masukkan email">

            <label>Kata Sandi</label>
            <input type="password" id="loginPassword" placeholder="Masukkan kata sandi">

            <button type="submit">Login</button>

            <p id="loginMessage"></p>

        </form>

        <p class="form-link">
            Belum punya akun?
            <a href="signup.html">Daftar di sini</a>
        </p>

    </section>

    <script src="js/script.js"></script>

</body>
</html>
